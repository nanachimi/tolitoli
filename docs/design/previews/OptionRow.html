<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600&display=swap" rel="stylesheet">
<style>
html{background:var(--surface)}body{margin:0;padding:16px;font-family:var(--font-body);color:var(--ink);display:flex;flex-direction:column;max-width:420px;gap:0}
.ico{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.group{background:var(--surface-raised);border:1px solid var(--hairline);border-radius:var(--radius-md);overflow:hidden;margin-bottom:var(--space-4)}
.row{display:flex;align-items:center;gap:var(--space-3);min-height:var(--control-md);padding:var(--space-3) var(--space-4);background:none;border:0;width:100%;text-align:start;font:inherit;color:var(--ink);cursor:pointer}
.row+.row{border-top:1px solid var(--hairline)}
.row .t{flex:1;min-width:0}.row p{margin:0}.row .caption{color:var(--ink-muted)}
.row .check{color:var(--accent)}.row[aria-checked=false] .check{visibility:hidden}
.sw{width:44px;height:26px;border-radius:var(--radius-pill);background:var(--surface-sunken);border:1px solid var(--hairline);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:18px;height:18px;border-radius:50%;background:var(--ink-muted)}
.sw.on{background:var(--accent);border-color:var(--accent)}.sw.on::after{inset-inline-start:21px;background:var(--on-accent)}
.chev{color:var(--ink-muted)}
.ov{margin:0 0 var(--space-2) var(--space-1);color:var(--ink-muted)}
</style></head><body>
<p class="overline ov">LANGUE DE L'INTERFACE</p>
<div class="group" role="radiogroup" aria-label="Langue de l'interface">
<button class="row body" role="radio" aria-checked="true"><span class="t">Français</span><svg class="ico check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></button>
<button class="row body" role="radio" aria-checked="false"><span class="t">English</span><svg class="ico check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></button>
<button class="row body" role="radio" aria-checked="false"><span class="t">Wolof</span><svg class="ico check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></button>
</div>
<div class="group">
<button class="row" role="switch" aria-checked="false"><svg class="ico" viewBox="0 0 24 24"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg><span class="t"><p class="body">Transcription cloud</p><p class="caption">Désactivée. Vos enregistrements restent sur l'appareil.</p></span><span class="sw"></span></button>
<button class="row"><svg class="ico" viewBox="0 0 24 24"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg><span class="t"><p class="body">Langue de transcription</p><p class="caption">Swahili · bonne</p></span><svg class="ico chev" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
</div>
</body></html>
