<!-- @dsCard group="Lecture" height=200 subtitle="en lecture, en pause" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600&display=swap" rel="stylesheet">
<style>
html{background:var(--surface)}body{margin:0;padding:16px;font-family:var(--font-body);color:var(--ink);display:flex;flex-direction:column;gap:var(--space-4);max-width:420px}
.ico{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.pl{background:var(--surface-raised);border:1px solid var(--hairline);border-radius:var(--radius-md);padding:var(--space-3) var(--space-4)}
.bar{position:relative;height:4px;border-radius:var(--radius-pill);background:var(--surface-sunken);margin:var(--space-2) 0}
.bar i{display:block;height:100%;border-radius:var(--radius-pill);background:var(--accent)}
.bar .knob{position:absolute;top:-6px;width:16px;height:16px;border-radius:var(--radius-pill);background:var(--accent);border:2px solid var(--surface-raised)}
.times{display:flex;justify-content:space-between;color:var(--ink-muted)}
.times span{font-variant-numeric:tabular-nums}
.ctl{display:flex;align-items:center;gap:var(--space-4);margin-top:var(--space-2)}
.play{width:48px;height:48px;border-radius:var(--radius-pill);background:var(--accent);color:var(--on-accent);border:0;display:grid;place-items:center;cursor:pointer}
.skip{background:none;border:0;color:var(--ink);cursor:pointer;display:flex;padding:var(--space-2)}
.rate{margin-inline-start:auto;min-height:32px;padding:0 var(--space-3);border-radius:var(--radius-pill);background:var(--surface-sunken);border:1px solid var(--hairline);color:var(--ink);font:inherit;cursor:pointer}
.paused .bar i,.paused .knob{background:var(--ink-muted)}
</style></head><body>
<div class="pl">
<div class="bar"><i style="width:38%"></i><span class="knob" style="inset-inline-start:calc(38% - 8px)"></span></div>
<div class="times caption"><span>12:14</span><span>32:08</span></div>
<div class="ctl">
<button class="skip" aria-label="Reculer de 15 secondes"><svg class="ico" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></button>
<button class="play" aria-label="Pause"><svg class="ico" viewBox="0 0 24 24"><rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/></svg></button>
<button class="skip" aria-label="Avancer de 15 secondes"><svg class="ico" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg></button>
<button class="rate caption">1×</button>
</div>
</div>
<div class="pl paused">
<div class="bar"><i style="width:38%"></i><span class="knob" style="inset-inline-start:calc(38% - 8px)"></span></div>
<div class="times caption"><span>12:14</span><span>32:08</span></div>
<div class="ctl">
<button class="skip" aria-label="Reculer de 15 secondes"><svg class="ico" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></button>
<button class="play" aria-label="Lire"><svg class="ico" viewBox="0 0 24 24"><path d="m6 3 14 9-14 9z" fill="currentColor" stroke="none"/></svg></button>
<button class="skip" aria-label="Avancer de 15 secondes"><svg class="ico" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg></button>
<button class="rate caption">1,5×</button>
</div>
</div>
</body></html>
