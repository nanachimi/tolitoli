<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600&display=swap" rel="stylesheet">
<style>
html{background:var(--surface)}body{margin:0;padding:16px;font-family:var(--font-body);color:var(--ink);display:flex;flex-direction:column;gap:var(--space-4);max-width:420px}
.ico{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.f{display:flex;align-items:center;gap:var(--space-2);min-height:var(--control-md);padding:0 var(--space-3);background:var(--surface-sunken);border:1px solid var(--hairline);border-radius:var(--radius-sm);color:var(--ink-muted)}
.f input{flex:1;min-width:0;border:0;background:none;font:inherit;color:var(--ink);outline:0;padding:0}
.f input::placeholder{color:var(--ink-faint)}
.clear{border:0;background:none;color:var(--ink-muted);cursor:pointer;padding:var(--space-1);display:flex}
.none{text-align:center;color:var(--ink-muted);padding:var(--space-4) 0}
.none p{margin:0}
</style></head><body>
<div class="f"><svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input class="body" placeholder="Rechercher dans les enregistrements" aria-label="Rechercher dans les enregistrements"></div>
<div class="f"><svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input class="body" value="fournisseur" aria-label="Rechercher dans les enregistrements"><button class="clear" aria-label="Effacer la recherche"><svg class="ico" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>
<div class="none"><p class="body-strong">Aucun résultat</p><p class="caption">Essayez un autre mot, ou cherchez dans le texte des transcriptions.</p></div>
</body></html>
