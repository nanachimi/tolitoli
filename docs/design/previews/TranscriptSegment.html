<!doctype html><html><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600&display=swap" rel="stylesheet">
<style>
html{background:var(--surface)}body{margin:0;padding:16px;font-family:var(--font-body);color:var(--ink);display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.ico{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
</style><style>
body{flex-direction:column;align-items:stretch;max-width:420px;gap:var(--space-2)}
.s{display:flex;gap:var(--space-3);padding:var(--space-2) var(--space-3);border-radius:var(--radius-sm)}
.s .timestamp{color:var(--ink-muted);flex:none;padding-top:4px}.s p{margin:0}
.s.active{background:var(--accent-soft)}.s.upcoming p{color:var(--ink-muted)}
.spk{display:block;color:var(--ink-muted)}
</style></head><body>
<div class="s"><span class="timestamp">12:04</span><div><span class="caption spk">Locuteur 1</span><p class="body">Tunaweza kuanza na bei ya usafiri kwanza.</p></div></div>
<div class="s active"><span class="timestamp">12:11</span><div><span class="caption spk">Locuteur 2</span><p class="body">Sawa, but the delivery schedule needs to move to Friday.</p></div></div>
<div class="s upcoming"><span class="timestamp">12:19</span><div><span class="caption spk">Locuteur 1</span><p class="body">Friday ni sawa, lakini tutahitaji confirmation kwa maandishi.</p></div></div>
</body></html>
