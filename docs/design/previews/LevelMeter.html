<!-- @dsCard group="Enregistrement" height=72 subtitle="niveau d'entrée 0 → 1" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600&display=swap" rel="stylesheet">
<style>
html{background:var(--surface)}body{margin:0;padding:16px;font-family:var(--font-body);color:var(--ink);display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.ico{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
</style><style>
.m{width:320px;height:12px;border-radius:var(--radius-pill);background:var(--surface-sunken);overflow:hidden;border:1px solid var(--hairline)}
.m i{display:block;height:100%;border-radius:var(--radius-pill);background:var(--accent)}
.m.quiet i{background:var(--ink-faint)}
</style></head><body>
<div class="m" role="meter" aria-label="Niveau du micro" aria-valuenow="62" aria-valuemin="0" aria-valuemax="100"><i style="width:62%"></i></div>
<div class="m quiet" role="meter" aria-label="Niveau du micro" aria-valuenow="4" aria-valuemin="0" aria-valuemax="100"><i style="width:4%"></i></div>
</body></html>
