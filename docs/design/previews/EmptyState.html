<!doctype html><html><head><style data-tokens="tolitoli">
:root{--surface:#f7f1e8;--surface-raised:#fffaf3;--surface-sunken:#efe6d9;--ink:#2a211b;--ink-muted:#6b5c50;--ink-faint:#9a8878;--hairline:#e3d7c8;--accent:#b84a24;--on-accent:#fff6ee;--accent-soft:#f6dccd;--ochre:#b8862b;--success:#1f6f66;--warning:#9a5b12;--danger:#a3281f;--focus:#1f5f8b;--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-6:24px;--space-8:32px;--space-12:48px;--radius-sm:8px;--radius-md:14px;--radius-lg:22px;--radius-pill:999px;--control-md:48px;--control-lg:72px;--control-xl:96px;--icon-sm:16px;--icon-md:24px;--icon-lg:32px;--stroke-icon:1.75px;--font-display:"Rubik", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;--font-body:system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;--font-mono:ui-monospace, "SF Mono", Menlo, Consolas, monospace;color-scheme:light dark}
@media (prefers-color-scheme: dark){:root:root{--surface:#1c1816;--surface-raised:#272120;--surface-sunken:#141110;--ink:#f3ebe1;--ink-muted:#b8a999;--ink-faint:#7f7164;--hairline:#3b332d;--accent:#e47d52;--on-accent:#2a1309;--accent-soft:#4a2a1d;--ochre:#d9a84c;--success:#62b5a6;--warning:#dca15a;--danger:#e5776f;--focus:#82b7e3}}
.display{font-family:var(--font-display);font-size:32px;line-height:38px;font-weight:600;letter-spacing:-0.01em}
.title{font-family:var(--font-display);font-size:24px;line-height:30px;font-weight:600}
.heading{font-family:var(--font-display);font-size:18px;line-height:24px;font-weight:500}
.timer{font-family:var(--font-display);font-size:48px;line-height:52px;font-weight:500;letter-spacing:0.02em;font-variant-numeric:tabular-nums}
.body{font-family:var(--font-body);font-size:16px;line-height:24px;font-weight:400}
.body-strong{font-family:var(--font-body);font-size:16px;line-height:24px;font-weight:600}
.caption{font-family:var(--font-body);font-size:13px;line-height:18px;font-weight:400}
.overline{font-family:var(--font-body);font-size:12px;line-height:16px;font-weight:600;letter-spacing:0.06em}
.timestamp{font-family:var(--font-mono);font-size:12px;line-height:16px;font-weight:500;font-variant-numeric:tabular-nums}
html,body{background:var(--surface);color:var(--ink)}
</style><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600&display=swap" rel="stylesheet">
<style>
html{background:var(--surface)}body{margin:0;padding:16px;font-family:var(--font-body);color:var(--ink);display:flex;flex-direction:column;gap:var(--space-8);max-width:420px}
.ico{width:32px;height:32px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.es{display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--space-2);padding:var(--space-6) var(--space-4)}
.es .halo{width:64px;height:64px;border-radius:var(--radius-pill);background:var(--accent-soft);display:grid;place-items:center;color:var(--accent);margin-bottom:var(--space-2)}
.es p{margin:0;max-width:300px}.es .caption{color:var(--ink-muted)}
.es .btn{margin-top:var(--space-3);display:inline-flex;align-items:center;min-height:var(--control-md);padding:0 var(--space-4);border-radius:var(--radius-md);background:var(--accent);color:var(--on-accent);border:0;font:inherit}
.es.quiet .halo{background:none;color:var(--ink-faint);margin:0}
</style></head><body>
